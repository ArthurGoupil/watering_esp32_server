steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - gcr.io/$PROJECT_ID/watering-esp32-server:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/watering-esp32-server:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - watering-esp32-server
      - --image
      - gcr.io/$PROJECT_ID/watering-esp32-server:$COMMIT_SHA
      - --region
      - europe-west1
      - --platform
      - managed
      - --quiet

images:
  - gcr.io/$PROJECT_ID/watering-esp32-server:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
